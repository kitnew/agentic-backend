<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Backend Debug Chat</title>
  <style>
    :root {
      --border: #d0d7de;
      --muted: #57606a;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --user: #0969da;
      --assistant: #1a7f37;
      --error: #cf222e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #24292f;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0 8px 0 0; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    input, textarea, button, select {
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    input, textarea { padding: 8px; }
    button {
      padding: 8px 12px;
      cursor: pointer;
      background: #24292f;
      color: #fff;
      border-color: #24292f;
    }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(420px, 1.1fr);
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 82px);
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .section-title {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .chat-log {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .message.user { border-left: 4px solid var(--user); }
    .message.assistant { border-left: 4px solid var(--assistant); }
    .message.error { border-left: 4px solid var(--error); }
    .message .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    form {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    textarea { min-height: 100px; resize: vertical; }
    pre {
      margin: 0;
      flex: 1;
      overflow: auto;
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 0 0 8px 8px;
    }
    .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .row label { flex: 1 1 160px; }
    .wide { min-width: 300px; }
    .status { color: var(--muted); font-size: 12px; }
    .title-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mode-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .mode-switch button {
      border: 0;
      border-radius: 0;
      background: #fff;
      color: #24292f;
      padding: 6px 10px;
    }
    .mode-switch button.active {
      background: #24292f;
      color: #fff;
    }
    .text-input-panel[hidden],
    .voice-panel[hidden] {
      display: none;
    }
    .voice-panel {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: grid;
      gap: 10px;
      background: #fff;
    }
    .voice-panel h2 {
      margin: 0;
      font-size: 14px;
    }
    .voice-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .voice-controls button.secondary {
      background: #fff;
      color: #24292f;
      border-color: var(--border);
    }
    .voice-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      display: inline-block;
    }
    .voice-indicator.active { background: var(--error); }
    .voice-timer {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 12px;
    }
    .voice-results {
      display: grid;
      gap: 8px;
    }
    .voice-results textarea {
      min-height: 56px;
      resize: vertical;
      background: #f6f8fa;
    }
    .voice-warning {
      color: #9a6700;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .voice-error {
      color: var(--error);
      font-size: 12px;
      white-space: pre-wrap;
    }
    #assistantAudio {
      width: 100%;
      min-height: 36px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; height: auto; }
      section { min-height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Debug Chat</h1>
    <label class="wide">Backend URL
      <input id="backendUrl" value="http://127.0.0.1:8000">
    </label>
    <label>API path
      <input id="apiPath" value="/api/v1/messages">
    </label>
    <span id="status" class="status">Idle</span>
  </header>

  <main>
    <section>
      <div class="section-title">
        <span>Conversation</span>
        <div class="title-actions">
          <div class="mode-switch" aria-label="Input mode">
            <button id="textModeButton" class="active" type="button">Text</button>
            <button id="voiceModeButton" type="button">Voice</button>
          </div>
          <button id="clearChat" type="button">Clear</button>
        </div>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <form id="messageForm">
        <div class="row">
          <label>Tenant ID
            <input id="tenantId" value="demo_restaurant" required>
          </label>
          <label>Channel
            <input id="channel" value="debug-chat" required>
          </label>
        </div>
        <div class="row">
          <label>External user ID
            <input id="externalUserId" value="debug-user">
          </label>
          <label>Conversation ID
            <input id="conversationId" placeholder="Empty means create/use new conversation">
          </label>
        </div>
        <div id="textInputPanel" class="text-input-panel">
          <label>Metadata JSON (optional)
            <input id="metadata" placeholder='{"source":"debug"}'>
          </label>
          <label>Message
            <textarea id="content" placeholder="Type a message..."></textarea>
          </label>
          <button id="sendButton" type="submit">Send</button>
        </div>
      </form>
      <div id="voicePanel" class="voice-panel" hidden>
        <div class="row">
          <h2>Voice message</h2>
          <span id="voiceStatus" class="status">Idle</span>
        </div>
        <div class="voice-controls">
          <label>Mode <select id="voiceInteractionMode"><option value="call" selected>Call</option><option value="manual">Manual</option></select></label>
          <button id="connectVoice" type="button">Start Call</button>
          <button id="disconnectVoice" class="secondary" type="button" disabled>End Call</button>
          <button id="muteVoice" class="secondary" type="button" disabled>Mute</button>
          <button id="reconnectVoice" class="secondary" type="button" disabled>Reconnect</button>
          <button id="startRecording" type="button">Start recording</button>
          <button id="stopRecording" type="button" disabled>Stop recording</button>
          <button id="resetVoiceConversation" class="secondary" type="button">Reset voice conversation</button>
          <span id="voiceIndicator" class="voice-indicator" aria-hidden="true"></span>
          <span id="recordingTimer" class="voice-timer">00:00</span>
        </div>
        <div class="status">Call session: <span id="callSessionId">none</span></div>
        <div class="voice-results">
          <label>Transcript
            <textarea id="voiceTranscript" readonly placeholder="No voice transcript yet."></textarea>
          </label>
          <label>Assistant response
            <textarea id="voiceAssistantResponse" readonly placeholder="No voice response yet."></textarea>
          </label>
          <div id="voiceWarnings" class="voice-warning"></div>
          <div id="voiceError" class="voice-error"></div>
          <audio id="assistantAudio" controls></audio>
        </div>
      </div>
    </section>

    <section>
      <div class="section-title">
        <span>Full API response</span>
        <button id="copyResponse" type="button">Copy JSON</button>
      </div>
      <pre id="apiResponse">No requests yet.</pre>
    </section>
  </main>

  <script src="/voice-protocol.js"></script>
  <script>
    const backendUrlInput = document.querySelector('#backendUrl');
    const apiPathInput = document.querySelector('#apiPath');
    const tenantIdInput = document.querySelector('#tenantId');
    const channelInput = document.querySelector('#channel');
    const externalUserIdInput = document.querySelector('#externalUserId');
    const conversationIdInput = document.querySelector('#conversationId');
    const metadataInput = document.querySelector('#metadata');
    const contentInput = document.querySelector('#content');
    const chatLog = document.querySelector('#chatLog');
    const apiResponse = document.querySelector('#apiResponse');
    const statusEl = document.querySelector('#status');
    const sendButton = document.querySelector('#sendButton');
    const textModeButton = document.querySelector('#textModeButton');
    const voiceModeButton = document.querySelector('#voiceModeButton');
    const textInputPanel = document.querySelector('#textInputPanel');
    const voicePanel = document.querySelector('#voicePanel');
    const startRecordingButton = document.querySelector('#startRecording');
    const stopRecordingButton = document.querySelector('#stopRecording');
    const resetVoiceConversationButton = document.querySelector('#resetVoiceConversation');
    const voiceStatusEl = document.querySelector('#voiceStatus');
    const voiceIndicator = document.querySelector('#voiceIndicator');
    const recordingTimer = document.querySelector('#recordingTimer');
    const voiceTranscript = document.querySelector('#voiceTranscript');
    const voiceAssistantResponse = document.querySelector('#voiceAssistantResponse');
    const voiceWarnings = document.querySelector('#voiceWarnings');
    const voiceError = document.querySelector('#voiceError');
    const assistantAudio = document.querySelector('#assistantAudio');
    const connectVoiceButton = document.querySelector('#connectVoice');
    const disconnectVoiceButton = document.querySelector('#disconnectVoice');
    const reconnectVoiceButton = document.querySelector('#reconnectVoice');
    const callSessionId = document.querySelector('#callSessionId');
    const voiceInteractionMode = document.querySelector('#voiceInteractionMode');
    const muteVoiceButton = document.querySelector('#muteVoice');

    const VOICE_API_PATH = '/api/v1/voice/messages';
    const MAX_RECORDING_MS = 30000;
    const PREFERRED_AUDIO_TYPES = [
      'audio/webm;codecs=opus',
      'audio/ogg;codecs=opus',
      'audio/webm',
      'audio/ogg',
    ];

    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];
    let selectedMimeType = '';
    let recordingStartedAt = 0;
    let recordingTimerInterval = null;
    let maxRecordingTimeout = null;
    let inputMode = 'text';
    let voiceBusy = false;
    let voiceSocket = null;
    let sessionToken = null;
    let voiceState = { connection: 'disconnected', processing: false };
    let audioObjectUrl = null;
    let audioContext = null;
    let workletNode = null;
    let streamingFrames = [];
    let streamingReady = false;
    let voiceMuted = false;
    let assistantTextSequence = 0;
    let voiceTimeline = [];
    let voiceTimelineStart = 0;
    let voiceTimelineSeen = new Set();
    const streamedPlayback = new VoiceProtocol.PCMPlayback({
      createAudioContext: () => audioContext,
      closeAudioContext: false,
      onStart: () => {
        traceVoice('browser_playback_started');
        voiceState.hasAssistantAudio = true; setVoiceState('processing', 'Assistant speaking...');
      },
      onDrain: () => { if (voiceSocket) startNextStreamingTurn(); },
      onError: error => showVoiceError(error.message),
    });

    const saved = JSON.parse(localStorage.getItem('debug-chat-settings') || '{}');
    for (const [id, value] of Object.entries(saved)) {
      const element = document.querySelector(`#${id}`);
      if (element && value !== undefined) element.value = value;
    }
    inputMode = saved.inputMode === 'voice' ? 'voice' : 'text';
    applyInputMode(inputMode);

    fetch('/config')
      .then((response) => response.json())
      .then((config) => {
        if (!saved.backendUrl && config.backend_url) backendUrlInput.value = config.backend_url;
        if (!saved.apiPath && config.api_path) apiPathInput.value = config.api_path;
      })
      .catch(() => {});

    document.querySelector('#messageForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const content = contentInput.value.trim();
      if (!content) return;

      let metadata = null;
      if (metadataInput.value.trim()) {
        try {
          metadata = JSON.parse(metadataInput.value);
        } catch (error) {
          appendMessage('error', 'UI', `Metadata JSON is invalid: ${error.message}`);
          return;
        }
      }

      const payload = compact({
        tenant_id: tenantIdInput.value.trim(),
        channel: channelInput.value.trim(),
        external_user_id: externalUserIdInput.value.trim(),
        conversation_id: conversationIdInput.value.trim(),
        content,
        metadata,
      });

      saveSettings();
      appendMessage('user', 'You', content);
      contentInput.value = '';
      setBusy(true, 'Sending...');

      try {
        const response = await fetch('/debug/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            backend_url: backendUrlInput.value.trim(),
            api_path: apiPathInput.value.trim(),
            payload,
          }),
        });
        const result = await response.json();
        apiResponse.textContent = JSON.stringify(result, null, 2);

        const backendResponse = result.response || {};
        if (backendResponse.conversation_id) {
          conversationIdInput.value = backendResponse.conversation_id;
          saveSettings();
        }

        if (!response.ok || result.error) {
          appendMessage('error', 'Proxy error', result.error || `HTTP ${response.status}`);
        } else if (result.proxied_status >= 400) {
          appendMessage('error', `Backend HTTP ${result.proxied_status}`, JSON.stringify(backendResponse, null, 2));
        } else {
          appendMessage('assistant', 'Assistant', backendResponse.response_text || backendResponse.assistant_message?.content || '(empty response)');
        }
      } catch (error) {
        appendMessage('error', 'Request failed', error.message);
        apiResponse.textContent = JSON.stringify({ error: error.message }, null, 2);
      } finally {
        setBusy(false, 'Idle');
      }
    });

    document.querySelector('#clearChat').addEventListener('click', () => {
      chatLog.innerHTML = '';
      apiResponse.textContent = 'No requests yet.';
    });

    textModeButton.addEventListener('click', () => switchInputMode('text'));
    voiceModeButton.addEventListener('click', () => switchInputMode('voice'));
    muteVoiceButton.addEventListener('click', () => {
      voiceMuted = !voiceMuted;
      for (const track of mediaStream?.getAudioTracks() || []) track.enabled = !voiceMuted;
      muteVoiceButton.textContent = voiceMuted ? 'Unmute' : 'Mute';
    });
    startRecordingButton.addEventListener('click', startVoiceRecording);
    stopRecordingButton.addEventListener('click', stopVoiceRecording);
    connectVoiceButton.addEventListener('click', connectVoice);
    disconnectVoiceButton.addEventListener('click', disconnectVoice);
    reconnectVoiceButton.addEventListener('click', () => {
      if (!voiceSocket) { connectVoice(); return; }
      voiceSocket.addEventListener('close', connectVoice, { once: true });
      voiceSocket.close();
    });
    resetVoiceConversationButton.addEventListener('click', () => {
      disconnectVoice();
      conversationIdInput.value = '';
      saveSettings();
      voiceStatusEl.textContent = 'Voice conversation reset';
      setTimeout(() => voiceStatusEl.textContent = 'Idle', 1200);
    });

    document.querySelector('#copyResponse').addEventListener('click', async () => {
      await navigator.clipboard.writeText(apiResponse.textContent);
      statusEl.textContent = 'Copied response JSON';
      setTimeout(() => statusEl.textContent = 'Idle', 1200);
    });

    function compact(value) {
      return Object.fromEntries(
        Object.entries(value).filter(([, item]) => item !== '' && item !== null && item !== undefined)
      );
    }

    function appendMessage(kind, author, text) {
      const message = document.createElement('div');
      message.className = `message ${kind}`;
      message.innerHTML = `<div class="meta"></div><div></div>`;
      message.children[0].textContent = `${author} · ${new Date().toLocaleTimeString()}`;
      message.children[1].textContent = text;
      chatLog.append(message);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setBusy(isBusy, text) {
      sendButton.disabled = isBusy;
      statusEl.textContent = text;
    }

    function switchInputMode(nextMode) {
      if (nextMode === inputMode) return;
      if (voiceBusy) {
        voiceStatusEl.textContent = 'Finish the current voice message before switching modes';
        return;
      }

      inputMode = nextMode;
      applyInputMode(inputMode);
      saveSettings();
    }

    function applyInputMode(nextMode) {
      const isVoice = nextMode === 'voice';
      textInputPanel.hidden = isVoice;
      voicePanel.hidden = !isVoice;
      textModeButton.classList.toggle('active', !isVoice);
      voiceModeButton.classList.toggle('active', isVoice);
      contentInput.required = !isVoice;
      if (isVoice) {
        statusEl.textContent = 'Voice input mode';
      } else {
        statusEl.textContent = 'Text input mode';
      }
      updateVoiceControlAvailability();
    }

    async function startVoiceRecording() {
      clearVoiceMessages();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showVoiceError('This browser does not support microphone capture.');
        return;
      }
      if (voiceState.sttMode === 'streaming') {
        await startStreamingRecording();
        return;
      }
      if (!window.MediaRecorder) {
        showVoiceError('This browser does not support MediaRecorder.');
        return;
      }

      selectedMimeType = selectRecordingMimeType();
      recordedChunks = [];

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(
          mediaStream,
          selectedMimeType ? { mimeType: selectedMimeType } : undefined
        );
      } catch (error) {
        cleanupMediaStream();
        showVoiceError(`Microphone recording could not start: ${error.message}`);
        return;
      }

      mediaRecorder.addEventListener('dataavailable', (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
          if (voiceSocket?.readyState === WebSocket.OPEN) voiceSocket.send(event.data);
        }
      });

      mediaRecorder.addEventListener('error', (event) => {
        cleanupRecordingTimers();
        cleanupMediaStream();
        setVoiceState('idle');
        showVoiceError(`Recording failed: ${event.error?.message || 'unknown MediaRecorder error'}`);
      });

      mediaRecorder.addEventListener('stop', () => {
        handleRecordingStopped().catch((error) => {
          setVoiceState('idle');
          showVoiceError(error.message);
        });
      });

      recordingStartedAt = Date.now();
      updateRecordingTimer();
      recordingTimerInterval = setInterval(updateRecordingTimer, 250);
      maxRecordingTimeout = setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') stopVoiceRecording();
      }, MAX_RECORDING_MS);

      mediaRecorder.start(100);
      setVoiceState('recording');
    }

    function stopVoiceRecording() {
      if (voiceState.sttMode === 'streaming') { stopStreamingRecording(); return; }
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      setVoiceState('stopping');
      mediaRecorder.stop();
    }

    async function handleRecordingStopped() {
      cleanupRecordingTimers();
      cleanupMediaStream();

      const blobType = selectedMimeType || recordedChunks[0]?.type || 'audio/webm';
      const audioBlob = new Blob(recordedChunks, { type: blobType });
      if (!audioBlob.size) {
        setVoiceState('idle');
        showVoiceError('Recording was empty.');
        return;
      }

      await sendVoiceRecording(audioBlob, blobType);
    }

    async function sendVoiceRecording(audioBlob, mimeType) {
      setVoiceState('processing');
      saveSettings();
      if (!voiceSocket || voiceSocket.readyState !== WebSocket.OPEN) throw new Error('Connect voice first.');
      const filename = `debug-recording-${Date.now()}.${extensionForMimeType(mimeType)}`;
      voiceSocket.send(JSON.stringify({ type: 'input_audio_commit', content_type: mimeType, filename }));
    }

    async function startStreamingRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
          channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        } });
        audioContext = new AudioContext();
        const source = `class PCM extends AudioWorkletProcessor {
          constructor(){super();this.b=[];this.phase=0;this.port.onmessage=()=>this.flush()}
          process(inputs){const c=inputs[0];if(!c.length)return true;const n=c[0].length;
            for(let i=0;i<n;i++){let v=0;for(const ch of c)v+=ch[i]/c.length;this.phase+=16000/sampleRate;
              if(this.phase>=1){this.phase-=1;this.b.push(Math.max(-1,Math.min(1,v)))}
              if(this.b.length===1600){const a=new ArrayBuffer(3200),d=new DataView(a);this.b.forEach((x,j)=>d.setInt16(j*2,x<0?x*32768:x*32767,true));this.port.postMessage(a,[a]);this.b=[]}}
            return true}
          flush(){if(this.b.length){const a=new ArrayBuffer(this.b.length*2),d=new DataView(a);this.b.forEach((x,j)=>d.setInt16(j*2,x<0?x*32768:x*32767,true));this.port.postMessage(a,[a]);this.b=[]}}
        } registerProcessor('pcm16',PCM)`;
        const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
        await audioContext.audioWorklet.addModule(url); URL.revokeObjectURL(url);
        workletNode = new AudioWorkletNode(audioContext, 'pcm16');
        workletNode.port.onmessage = ({ data }) => streamingReady ? voiceSocket.send(data) : streamingFrames.push(data);
        audioContext.createMediaStreamSource(mediaStream).connect(workletNode);
        streamingFrames = []; streamingReady = false;
        startNextStreamingTurn();
        recordingStartedAt = Date.now(); recordingTimerInterval = setInterval(updateRecordingTimer, 250);
        if (voiceInteractionMode.value !== 'call') maxRecordingTimeout = setTimeout(stopVoiceRecording, MAX_RECORDING_MS);
        setVoiceState('starting', 'Starting realtime STT...');
      } catch (error) { cleanupMediaStream(); showVoiceError(error.message); updateVoiceControlAvailability(); }
    }

    function startNextStreamingTurn() {
      streamingReady = false;
      const call = voiceInteractionMode.value === 'call';
      voiceSocket.send(JSON.stringify({ type: 'input_audio_start', mode: call ? 'call' : 'manual',
        commit_strategy: call ? 'vad' : 'manual', content_type: 'audio/pcm', sample_rate: 16000, channels: 1 }));
      setVoiceState('starting', call ? 'Listening...' : 'Starting realtime STT...');
    }

    async function stopStreamingRecording() {
      if (!workletNode || !voiceState.turnId) return;
      setVoiceState('stopping', 'Finalizing transcript...');
      workletNode.port.postMessage('flush');
      await new Promise((resolve) => setTimeout(resolve, 0));
      for (const frame of streamingFrames.splice(0)) voiceSocket.send(frame);
      voiceSocket.send(JSON.stringify({ type: 'input_audio_commit', turn_id: voiceState.turnId }));
      workletNode.disconnect(); workletNode = null;
      if (audioContext) await audioContext.close(); audioContext = null;
      cleanupRecordingTimers(); cleanupMediaStream();
    }

    async function connectVoice() {
      clearVoiceMessages();
      voiceTimeline = []; voiceTimelineSeen.clear(); voiceTimelineStart = performance.now();
      try {
        const response = await fetch('/debug/voice-session', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(compact({ tenant_id: tenantIdInput.value.trim(), conversation_id: conversationIdInput.value.trim(), mode: voiceInteractionMode.value })),
        });
        if (!response.ok) throw new Error(readBackendError(await response.json(), `Session HTTP ${response.status}`));
        const session = VoiceProtocol.parseSession(await response.json());
        sessionToken = session.session_token;
        callSessionId.textContent = session.call_session_id;
        voiceSocket = new WebSocket(session.websocket_url, ['voice-session', sessionToken]);
        voiceSocket.onopen = () => {
          sessionToken = null;
          if (voiceSocket.protocol !== 'voice-session') { voiceSocket.close(); showVoiceError('Server did not select voice-session protocol.'); return; }
          voiceStatusEl.textContent = 'Connected'; updateVoiceControlAvailability();
          if (voiceInteractionMode.value === 'call') startStreamingRecording();
        };
        voiceSocket.onmessage = ({ data }) => { if (typeof data === 'string') handleVoiceEvent(JSON.parse(data)); };
        voiceSocket.onerror = () => showVoiceError('WebSocket connection failed.');
        voiceSocket.onclose = () => {
          voiceSocket = null; streamingReady = false; voiceState.connection = 'disconnected';
          if (workletNode) workletNode.disconnect(); workletNode = null;
          if (audioContext) audioContext.close(); audioContext = null;
          cleanupRecordingTimers(); cleanupMediaStream(); revokeAudioUrl();
          streamedPlayback.stop();
          setVoiceState('idle', 'Disconnected'); updateVoiceControlAvailability();
        };
        updateVoiceControlAvailability();
      } catch (error) { sessionToken = null; showVoiceError(error.message); }
    }

    function disconnectVoice() {
      streamingReady = false;
      if (voiceSocket?.readyState === WebSocket.OPEN) voiceSocket.send(JSON.stringify({ type: 'session_end' }));
      if (workletNode) workletNode.disconnect(); workletNode = null;
      if (audioContext) audioContext.close(); audioContext = null;
      cleanupMediaStream();
      if (voiceSocket) voiceSocket.close();
      voiceSocket = null; sessionToken = null; revokeAudioUrl(); updateVoiceControlAvailability();
      streamedPlayback.stop();
    }

    function handleVoiceEvent(event) {
      voiceState = VoiceProtocol.transition(voiceState, event);
      const markers = {
        assistant_text_started: 'assistant_text_started',
        assistant_text_delta: 'first_text_delta',
        assistant_audio_started: 'assistant_audio_started',
        assistant_audio_chunk: 'browser_audio_chunk_received',
        assistant_text_completed: 'text_completed',
        assistant_audio_completed: 'audio_completed',
        turn_completed: 'turn_completed',
      };
      if (markers[event.type]) traceVoice(markers[event.type], event);
      apiResponse.textContent = JSON.stringify({ event, streaming_timeline: voiceTimeline }, null, 2);
      if (event.conversation_id) { conversationIdInput.value = event.conversation_id; saveSettings(); }
      if (event.type === 'audio_chunk_received') voiceStatusEl.textContent = 'Audio buffered';
      if (event.type === 'input_audio_started') {
        streamingReady = true;
        for (const frame of streamingFrames.splice(0)) voiceSocket.send(frame);
        setVoiceState('recording');
      }
      if (event.type === 'listening_started' || event.type === 'listening_resumed') {
        streamingReady = true; voiceState.hasAssistantAudio = false; setVoiceState('recording', 'Listening...');
      }
      if (event.type === 'speech_started') setVoiceState('recording', 'Speaking...');
      if (event.type === 'speech_ended') { streamingReady = false; setVoiceState('stopping', 'Finalizing transcript...'); }
      if (event.type === 'transcript_partial') voiceTranscript.value = event.text || '';
      if (event.type === 'processing_started' || event.code === 'processing_busy') setVoiceState('processing');
      if (event.type === 'transcript' || event.type === 'transcript_completed') { voiceTranscript.value = event.text || event.transcript || ''; appendMessage('user', 'Voice transcript', voiceTranscript.value); }
      if (event.type === 'assistant_response') { voiceAssistantResponse.value = event.text || ''; appendMessage('assistant', 'Assistant', voiceAssistantResponse.value); }
      if (event.type === 'assistant_text_started') { voiceAssistantResponse.value = ''; assistantTextSequence = 0; }
      if (event.type === 'assistant_text_delta') {
        if (event.sequence === assistantTextSequence + 1) {
          voiceAssistantResponse.value += event.delta || ''; assistantTextSequence = event.sequence;
        } else if (event.sequence > assistantTextSequence) showVoiceError('Assistant text sequence gap.');
      }
      if (event.type === 'assistant_text_completed') { voiceAssistantResponse.value = event.text || ''; appendMessage('assistant', 'Assistant', voiceAssistantResponse.value); }
      if (event.type === 'assistant_audio') { voiceState.hasAssistantAudio = true; playAssistantEventAudio(event, voiceInteractionMode.value === 'call'); }
      if (event.type === 'assistant_audio_started') streamedPlayback.start();
      if (event.type === 'assistant_audio_chunk') streamedPlayback.push(event);
      if (event.type === 'assistant_audio_completed') streamedPlayback.completeAudio();
      if (event.type === 'error') showVoiceError(event.message || event.code || event.type);
      if (event.type === 'session_ended') disconnectVoice();
      if (!voiceState.processing && event.type === 'turn_completed' && voiceInteractionMode.value !== 'call') setVoiceState('idle', 'Voice turn completed');
      else if (event.type === 'turn_completed' && streamedPlayback.active) streamedPlayback.completeTurn();
      else if (event.type === 'turn_completed' && voiceInteractionMode.value === 'call' && !voiceState.hasAssistantAudio) startNextStreamingTurn();
      else if (event.type === 'turn_ignored' && voiceInteractionMode.value === 'call') startNextStreamingTurn();
      else updateVoiceControlAvailability();
    }

    function playAssistantEventAudio(event, resumeCall = false) {
      revokeAudioUrl();
      if (event.audio_base64) {
        const bytes = Uint8Array.from(atob(event.audio_base64), (c) => c.charCodeAt(0));
        audioObjectUrl = URL.createObjectURL(new Blob([bytes], { type: event.content_type || 'audio/mpeg' }));
        assistantAudio.src = audioObjectUrl;
      } else if (event.audio_url) assistantAudio.src = resolveBackendAssetUrl(event.audio_url);
      assistantAudio.load();
      if (resumeCall) setVoiceState('processing', 'Assistant speaking...');
      const playbackWatchdog = setTimeout(() => { assistantAudio.pause(); resume(); }, 120000);
      const resume = () => { clearTimeout(playbackWatchdog); assistantAudio.onended = assistantAudio.onerror = null; if (resumeCall && voiceSocket) startNextStreamingTurn(); };
      assistantAudio.onended = resume; assistantAudio.onerror = resume;
      assistantAudio.play().catch(() => { showVoiceWarnings(['Playback failed; listening resumed.']); resume(); });
    }

    function revokeAudioUrl() { if (audioObjectUrl) URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }

    function traceVoice(marker, event = {}) {
      if (voiceTimelineSeen.has(marker)) return;
      voiceTimelineSeen.add(marker);
      voiceTimeline.push({
        marker,
        browser_elapsed_ms: Math.round(performance.now() - voiceTimelineStart),
        server_stream_elapsed_ms: event.stream_elapsed_ms ?? null,
        sequence: event.sequence ?? null,
        size_bytes: event.size_bytes ?? null,
        first_tts_fragment_submitted_ms: event.first_tts_fragment_submitted_ms ?? null,
        first_provider_audio_received_ms: event.first_provider_audio_received_ms ?? null,
      });
    }

    function selectRecordingMimeType() {
      for (const mimeType of PREFERRED_AUDIO_TYPES) {
        if (MediaRecorder.isTypeSupported(mimeType)) return mimeType;
      }
      return '';
    }

    function extensionForMimeType(mimeType) {
      if (mimeType.includes('ogg')) return 'ogg';
      return 'webm';
    }

    function buildVoiceProxyUrl() {
      const params = new URLSearchParams({
        backend_url: getBackendBaseUrl(),
        api_path: VOICE_API_PATH,
      });
      return `/debug/voice-message?${params.toString()}`;
    }

    function getBackendBaseUrl() {
      return (backendUrlInput.value.trim() || window.location.origin).replace(/\/+$/, '');
    }

    function resolveBackendAssetUrl(url) {
      return new URL(url, `${getBackendBaseUrl()}/`).href;
    }

    async function playAssistantAudio(audioUrl) {
      assistantAudio.pause();
      assistantAudio.removeAttribute('src');
      assistantAudio.load();

      if (!audioUrl) {
        showVoiceWarnings(['Backend response did not include audio_url.']);
        return;
      }

      assistantAudio.src = resolveBackendAssetUrl(audioUrl);
      assistantAudio.load();
      try {
        await assistantAudio.play();
      } catch (error) {
        showVoiceWarnings([
          ...collectVisibleWarnings(),
          'Click play to listen to the response.',
        ]);
      }
    }

    function collectVoiceWarnings(backendResponse) {
      const warnings = [];
      const metadataWarnings = backendResponse.metadata?.warnings;
      if (Array.isArray(metadataWarnings)) warnings.push(...metadataWarnings);
      if (!backendResponse.audio_url) warnings.push('Backend response did not include audio_url.');
      return warnings.filter(Boolean);
    }

    function collectVisibleWarnings() {
      return voiceWarnings.textContent
        .split('\n')
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function showVoiceWarnings(warnings) {
      voiceWarnings.textContent = warnings.length ? warnings.join('\n') : '';
    }

    function showVoiceError(text) {
      voiceError.textContent = text;
      voiceStatusEl.textContent = 'Error';
    }

    function clearVoiceMessages() {
      voiceError.textContent = '';
      voiceWarnings.textContent = '';
    }

    function readBackendError(value, fallback) {
      if (!value) return fallback;
      if (typeof value === 'string') return value;
      if (typeof value.detail === 'string') return value.detail;
      if (value.detail) return JSON.stringify(value.detail);
      if (value.error) return String(value.error);
      return JSON.stringify(value, null, 2);
    }

    function setVoiceState(state, text) {
      const isRecording = state === 'recording';
      voiceBusy = isRecording || state === 'starting' || state === 'stopping' || state === 'processing';
      updateVoiceControlAvailability(isRecording);
      voiceIndicator.classList.toggle('active', isRecording);

      if (text) {
        voiceStatusEl.textContent = text;
      } else if (state === 'recording') {
        voiceStatusEl.textContent = 'Recording...';
      } else if (state === 'stopping') {
        voiceStatusEl.textContent = 'Stopping recording...';
      } else if (state === 'processing') {
        voiceStatusEl.textContent = 'Processing voice message...';
      } else {
        voiceStatusEl.textContent = 'Idle';
      }
    }

    function updateVoiceControlAvailability(isRecording = false) {
      const voiceModeActive = inputMode === 'voice';
      const connected = voiceSocket && voiceSocket.readyState === WebSocket.OPEN;
      startRecordingButton.disabled = !voiceModeActive || voiceBusy || !connected;
      stopRecordingButton.disabled = !voiceModeActive || !isRecording;
      resetVoiceConversationButton.disabled = !voiceModeActive || voiceBusy;
      textModeButton.disabled = voiceBusy;
      voiceModeButton.disabled = voiceBusy;
      connectVoiceButton.disabled = !voiceModeActive || !!voiceSocket;
      disconnectVoiceButton.disabled = !voiceSocket;
      muteVoiceButton.disabled = !connected || voiceInteractionMode.value !== 'call';
      reconnectVoiceButton.disabled = !voiceModeActive || voiceBusy;
    }

    function updateRecordingTimer() {
      const elapsedMs = recordingStartedAt ? Date.now() - recordingStartedAt : 0;
      recordingTimer.textContent = formatDuration(elapsedMs);
    }

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function cleanupRecordingTimers() {
      if (recordingTimerInterval) clearInterval(recordingTimerInterval);
      if (maxRecordingTimeout) clearTimeout(maxRecordingTimeout);
      recordingTimerInterval = null;
      maxRecordingTimeout = null;
      updateRecordingTimer();
    }

    function cleanupMediaStream() {
      if (mediaStream) {
        for (const track of mediaStream.getTracks()) track.stop();
      }
      mediaStream = null;
      mediaRecorder = null;
    }

    function saveSettings() {
      localStorage.setItem('debug-chat-settings', JSON.stringify({
        backendUrl: backendUrlInput.value,
        apiPath: apiPathInput.value,
        tenantId: tenantIdInput.value,
        channel: channelInput.value,
        externalUserId: externalUserIdInput.value,
        conversationId: conversationIdInput.value,
        metadata: metadataInput.value,
        inputMode,
      }));
    }
  </script>
</body>
</html>
