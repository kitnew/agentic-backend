x-production-service: &production-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
      max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  api:
    <<: *production-service
    image: ${APP_IMAGE_REPOSITORY:-agentic-backend}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env.production}
    ports: !reset []
    volumes: !reset []
    environment:
      APP_ENV: ${APP_ENV:-production}
      LIVEKIT_DEBUG_AUTH_ENABLED: "false"
      LIVEKIT_DEBUG_ALLOWED_TENANTS: ""
      LIVEKIT_STAGING_AUTH_ENABLED: ${LIVEKIT_STAGING_AUTH_ENABLED:-false}
      LIVEKIT_STAGING_AUTH_CREDENTIAL: ${LIVEKIT_STAGING_AUTH_CREDENTIAL:-}
      LIVEKIT_STAGING_ALLOWED_TENANTS: ${LIVEKIT_STAGING_ALLOWED_TENANTS:-}
      VOICE_TURN_DEBUG_OVERRIDES_ENABLED: "false"
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-redis:6379}
      INBOUND_SIP_ENABLED: ${INBOUND_SIP_ENABLED:-false}
      LIVEKIT_SIP_EXTERNAL_IP: ${LIVEKIT_SIP_EXTERNAL_IP:-}
      LIVEKIT_SIP_DOMAIN: ${LIVEKIT_SIP_DOMAIN:-}
      LIVEKIT_SIP_PORT: ${LIVEKIT_SIP_PORT:-5060}
      LIVEKIT_SIP_RTP_PORT_START: ${LIVEKIT_SIP_RTP_PORT_START:-10000}
      LIVEKIT_SIP_RTP_PORT_END: ${LIVEKIT_SIP_RTP_PORT_END:-20000}
      LIVEKIT_SIP_EXPECTED_TRUNK_ID: ${LIVEKIT_SIP_EXPECTED_TRUNK_ID:-}
      LIVEKIT_SIP_EXPECTED_RULE_ID: ${LIVEKIT_SIP_EXPECTED_RULE_ID:-}
    depends_on:
      livekit:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-45s}

  capability-worker:
    <<: *production-service
    image: ${WORKER_IMAGE_REPOSITORY:-agentic-capability-worker}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env.production}
    volumes: !reset []
    stop_signal: SIGTERM
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-2m}

  voice-agent:
    <<: *production-service
    image: ${VOICE_AGENT_IMAGE_REPOSITORY:-agentic-voice-agent}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env.production}
    ports: !reset []
    environment:
      APP_ENV: ${APP_ENV:-production}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      BACKEND_INTERNAL_URL: http://api:8000
      INBOUND_SIP_ENABLED: ${INBOUND_SIP_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: ${VOICE_AGENT_STOP_GRACE_PERIOD:-30m}

  debug-chat:
    <<: *production-service
    build:
      context: .
      target: debug-chat
    image: ${DEBUG_CHAT_IMAGE_REPOSITORY:-agentic-debug-chat}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env.production}
    environment:
      BACKEND_URL: http://api:8000
      APP_ENV: ${APP_ENV:-production}
      LIVEKIT_STAGING_AUTH_CREDENTIAL: ${LIVEKIT_STAGING_AUTH_CREDENTIAL:-}
      LIVEKIT_STAGING_ALLOWED_TENANTS: ${LIVEKIT_STAGING_ALLOWED_TENANTS:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    stop_signal: SIGTERM
    stop_grace_period: 15s

  livekit:
    <<: *production-service
    image: ${LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.13.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env.production}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env.production}"
      NODE_IP: ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP in .env.production}
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
          json: true
          sample: true
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-redis:6379}
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT:-7881}
          port_range_start: ${LIVEKIT_RTC_UDP_PORT_START:-50000}
          port_range_end: ${LIVEKIT_RTC_UDP_PORT_END:-50100}
          use_external_ip: false
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-true}
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT_START:-50000}-${LIVEKIT_RTC_UDP_PORT_END:-50100}:${LIVEKIT_RTC_UDP_PORT_START:-50000}-${LIVEKIT_RTC_UDP_PORT_END:-50100}/udp"
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7880"]
      interval: 10s
      timeout: 3s
      retries: 12
    stop_signal: SIGTERM
    stop_grace_period: 1m

  livekit-sip:
    <<: *production-service
    profiles: ["sip"]
    network_mode: host
    image: ${LIVEKIT_SIP_IMAGE:-livekit/sip:v1.7.0}
    environment:
      LIVEKIT_SIP_HEALTH_PORT: ${LIVEKIT_SIP_HEALTH_PORT:-8082}
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env.production}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env.production}
        ws_url: ${LIVEKIT_SIP_INTERNAL_URL:-ws://127.0.0.1:7880}
        redis:
          address: ${LIVEKIT_SIP_REDIS_ADDRESS:-127.0.0.1:6379}
        health_port: ${LIVEKIT_SIP_HEALTH_PORT:-8082}
        sip_port: ${LIVEKIT_SIP_PORT:-5060}
        rtp_port: ${LIVEKIT_SIP_RTP_PORT_START:-10000}-${LIVEKIT_SIP_RTP_PORT_END:-20000}
        nat_1_to_1_ip: ${LIVEKIT_SIP_EXTERNAL_IP:-}
        logging:
          level: info
          json: true
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "port_hex=$$(printf '%04X' '${LIVEKIT_SIP_HEALTH_PORT:-8082}'); grep -qi \":$${port_hex} \" /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    stop_signal: SIGTERM
    stop_grace_period: 1m

  caddy:
    <<: *production-service
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
      DEBUG_CHAT_DOMAIN: ${DEBUG_CHAT_DOMAIN:?set DEBUG_CHAT_DOMAIN in .env.production}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in .env.production}
      DEBUG_CHAT_BASIC_AUTH_USER: ${DEBUG_CHAT_BASIC_AUTH_USER:?set DEBUG_CHAT_BASIC_AUTH_USER in .env.production}
      DEBUG_CHAT_BASIC_AUTH_HASH: ${DEBUG_CHAT_BASIC_AUTH_HASH:?set DEBUG_CHAT_BASIC_AUTH_HASH in .env.production}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      debug-chat:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "caddy",
          "validate",
          "--config",
          "/etc/caddy/Caddyfile",
          "--adapter",
          "caddyfile",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_signal: SIGTERM
    stop_grace_period: 30s

  postgres:
    <<: *production-service
    stop_grace_period: 1m

  redis:
    <<: *production-service
    ports:
      - "127.0.0.1:6379:6379/tcp"
    stop_grace_period: 1m

volumes:
  caddy-data:
  caddy-config:

secrets:
  google-service-account:
    file: ${GOOGLE_SERVICE_ACCOUNT_FILE:?set GOOGLE_SERVICE_ACCOUNT_FILE in .env.production}
