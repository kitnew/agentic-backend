schema_version: 2
tenant_id: demo_restaurant
name: Demo Restaurant
business_type: restaurant

default_language: sk
locale: sk-SK
supported_locales:
  - sk-SK
timezone: Europe/Bratislava

agent:
  profile: restaurant_assistant
  display_name: "Sasha"
  use_display_name: false
  greeting_phrase: "Vitajte v našej reštaurácii."
  tone: friendly_professional
  language: sk
  style_rules:
    - "Keep answers short and clear."
    - "Do not ask again for information already provided by the customer."
    - "Do not overpromise reservations."
    - "If an action requires staff confirmation, say that clearly."
    - "Use a friendly but professional tone."

prompt:
  tenant_instructions: |
    You represent Demo Restaurant.
    Answer primarily in Slovak unless the customer uses another language.
    Use known information from the conversation and do not ask for it again.
    Do not invent business facts.
    Never claim that a reservation is confirmed unless the system explicitly confirms it.
    If reservation confirmation requires staff approval, clearly say that the reservation request is waiting for confirmation.

business_info:
  opening_hours_text: "10:00 - 21:00 every day except Sunday"
  parking: "Parking is available on the street near the restaurant."
  address: "Demo ulica 12, Bratislava"
  phone: "+421 900 000 000"
  menu_summary: "Sezónne jedlá, denné menu a výber domácich dezertov."

reservation:
  enabled: true
  mode: request_only
  requires_human_confirmation: true
  can_confirm_reservation: false

  required_fields:
    guest_name:
      required: true
      label: "name for the reservation"
    date:
      required: true
      label: "reservation date"
    time:
      required: true
      label: "reservation time"
    party_size:
      required: true
      label: "number of guests"
    phone:
      required: true
      label: "phone number"

  schedule:
    weekly:
      monday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      tuesday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      wednesday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      thursday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      friday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      saturday:
        open: true
        intervals:
          - start: "10:00"
            end: "21:00"
      sunday:
        open: false
        intervals: []

features:
  factual_qa: true
  room_recommendation: false
  availability_check: false
  reservation_create: true
  reservation_modify: false
  reservation_cancel: false
  reservation_lookup: false
  human_transfer: false

voice:
  enabled: true
  handoff: false
  outbound_dids: []
  outbound_trunk_id: ""

  stt:
    provider: elevenlabs
    model: scribe_v2
    language: slk
    keyterms:
      - rezervácia
      - parkovanie
      - terasa
      - alergény
      - telefónne číslo
      - dátum
      - čas
      - osoby

  tts:
    provider: elevenlabs
    model: eleven_flash_v2_5
    voice_id: 9Nd358gE1qQp0pDh8FgP
    output_format: mp3_44100_128
    language: sk

  fallback:
    send_text_if_tts_fails: true
    continue_if_stt_metadata_missing: true

capabilities:
  reservation.create_request:
    enabled: true
    provider: google_sheets
    config:
      spreadsheet_id: "1YaOGHsa8lGN9MLJ05z5Hac-l805no23l9mFz8PB4wVI"
      sheet_name: "test"

  reservation.check_availability:
    enabled: false
    provider: disabled

  notification.send_staff_message:
    enabled: false
    provider: disabled
