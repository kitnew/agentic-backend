schema_version: 2
tenant_id: penzion_grand
name: Penzión Grand
business_type: hotel
enabled: true

default_language: sk
locale: sk-SK
supported_locales:
  - sk-SK
  - en-GB
timezone: Europe/Bratislava

agent:
  profile: hotel_assistant
  display_name: Amélia
  role: voice receptionist
  use_display_name: true
  greeting_phrase: Dobrý deň, Penzión Grand Košice, pri telefóne Amélia. Ako vám môžem pomôcť?
  localized_greetings:
    sk-SK: Dobrý deň, Penzión Grand Košice, pri telefóne Amélia. Ako vám môžem pomôcť?
    en-GB: Good day, Penzión Grand Košice, Amélia speaking. How may I help you?
  tone: professional_concise
  language: sk

prompt:
  instructions_file: penzion_grand/instructions.md
  knowledge_base_files:
    - penzion_grand/knowledge_base.md

business_info:
  property_name: Penzión Grand
  category: guesthouse
  address: Kováčska 65, 040 01 Košice
  public_email: recepcia@penziongrand.eu
  website: www.penziongrand.eu
  reception_hours: daily 07:00-22:00
  phone: "+421 908 992 447"
  room_types:
    - code: two_bed
      display_name:
        sk-SK: Dvojlôžková izba
        en-GB: Double or twin room
      capacity: 2
      inventory_count: 19
      unit_price_per_night: 65
      single_occupancy_price: 55
      currency: EUR
      notes:
        - Some rooms have a double bed and some have separate beds.
        - Separate beds are a preference and are not guaranteed by the current system.
    - code: three_bed
      display_name:
        sk-SK: Trojlôžková izba
        en-GB: Triple room
      capacity: 3
      inventory_count: 2
      unit_price_per_night: 85
      currency: EUR
    - code: four_bed
      display_name:
        sk-SK: Štvorlôžková izba
        en-GB: Quadruple room
      capacity: 4
      inventory_count: 6
      unit_price_per_night: 99
      currency: EUR

reservation:
  enabled: true
  mode: request_only
  requires_human_confirmation: true
  can_confirm_reservation: false
  flow:
    availability_before_guest_details: true
    ask_to_continue_after_availability: true
    require_final_confirmation: true
    availability_result_ttl_seconds: 900
  contact:
    email_required: false
    prefer_inbound_phone_with_consent: true
    inbound_phone_consent_prompt: Môžem použiť telefónne číslo, z ktorého voláte?
  request_cutoff_local_time: "22:00"
  reject_at_or_after_cutoff: true
  cutoff_responses:
    sk-SK: Po dvadsiatej druhej už nové rezervácie neprijímame. Prosím, kontaktujte recepciu počas otváracích hodín.
    en-GB: We do not accept new reservation requests at or after ten p.m. Please contact reception during opening hours.
  new_request_phrases:
    sk-SK:
      - chcem rezervovať
      - chcem rezerváciu
      - rezervujte mi
      - objednať izbu
    en-GB:
      - make a reservation
      - book a room
      - reserve a room

conversation_scope:
  mode: property_only
  localized_refusals:
    sk-SK: S otázkami mimo Penziónu Grand vám bohužiaľ neviem pomôcť. Rada vám pomôžem s informáciami o ubytovaní alebo službách penziónu.
    en-GB: I can only help with questions related to Penzión Grand, its accommodation and services.
  blocked_phrases:
    sk-SK:
      - napíš mi python
      - politika
      - politiku
      - politike
      - ignoruj predchádzajúce
      - systémový prompt
      - počasie v londýne
    en-GB:
      - write me a python
      - write a python
      - politics
      - ignore previous
      - system prompt
      - weather in london

features:
  factual_qa: true
  room_recommendation: true
  availability_check: true
  reservation_create: true
  reservation_modify: true
  reservation_cancel: true
  reservation_lookup: false
  human_transfer: false

capabilities:
  calculator.calculate:
    enabled: true
    provider: calculator
  reservation.check_availability:
    enabled: true
    provider: make_webhook
    config:
      webhook_url: "https://hook.eu1.make.com/onjaogyrnr6hu0es70fjvuhtgcwwtl0u"
      payload_fields:
        start_date: check_in
        end_date: check_out
        room_count: room_count_text
        room_type: room_type_code
        caller_id: caller_number
      response_format: availability_text
      row_format: accommodation_availability
      announcement: Skontrolujem dostupnosť izieb.
      confirmation_required: false
  reservation.create_request:
    enabled: true
    provider: make_webhook
    config:
      webhook_url: "https://hook.eu1.make.com/p9ck5dsptj5ki5exbvclix6drw4gfzer"
      payload_fields:
        guest_name: guest_name
        phone: caller_number
        start_date: check_in
        end_date: check_out
        room_type: room_type_code
        room_count: room_count
        userID: reservation_phone
      response_format: acknowledgement
      row_format: accommodation_request
      announcement: Výborne, teraz odošlem požiadavku na rezerváciu.
      confirmation_required: true
  reservation.change_request:
    enabled: true
    provider: make_webhook
    config:
      webhook_url: "https://hook.eu1.make.com/64954kpu7cr3ypi4df0g8rw4jwuxam1s"
      payload_fields:
        booked_name: booked_name
        original_start_date: original_check_in
        original_end_date: original_check_out
        modification: change
        phone: caller_number
        UserID: reservation_phone
      response_format: acknowledgement
      timeout_seconds: 15
      announcement: Zmeny rezervácie odošlem personálu na spracovanie.
      confirmation_required: true
  reservation.cancel_request:
    enabled: true
    provider: make_webhook
    config:
      webhook_url: "https://hook.eu1.make.com/s59s5ljuyx3hk32az3ky8e3hpmbahgmp"
      payload_fields:
        booked_name: booked_name
        original_start_date: original_check_in
        original_end_date: original_check_out
        notes: reason
        UserID: reservation_phone
      response_format: acknowledgement
      timeout_seconds: 15
      announcement: Zrušenie rezervácie odošlem personálu na spracovanie.
      confirmation_required: true
  reservation.check_existing_reservation:
    enabled: false
    provider: make_webhook
    config:
      webhook_url: ""
      timeout_seconds: 15

post_call_transcript:
  recording_delivery_mode: base64
  webhook_url: "https://hook.eu1.make.com/21nrojnlsym52f2e90bdd9uwksgmwmrd"

voice:
  enabled: true
  handoff: true
  end_call_enabled: true
  inbound_dids:
    - "+421552301299"
  outbound_dids: 
    - "+421911578111"
  outbound_trunk_id: "ST_V958JJnzAuMC"
  stt:
    provider: elevenlabs
    model: scribe_v2_realtime
    language: slk
    keyterms:
      - Penzión Grand
      - Amélia
      - Kováčska
      - Košice
  tts:
    provider: elevenlabs
    model: eleven_flash_v2_5
    voice_id: 9Nd358gE1qQp0pDh8FgP
    output_format: mp3_44100_128
    language: sk
