agent:
  display_name: Amelia
  greeting: Dobrý deň, tu je Amélia. Tento hovor sa nahrava. Ako vám môžem pomôcť?
  profile: hotel_assistant
business:
  name: Debug Hotel
  type: hotel
conversation:
  scope: property_only
localization:
  default_locale: sk-SK
  timezone: Europe/Bratislava
schema_version: 4
capabilities:
  reservation.check_availability:
    agent_input_schema:
      additionalProperties: false
      properties:
        check_in:
          format: date
          type: string
          x-canonical-field: stay.check_in
        check_out:
          format: date
          type: string
          x-canonical-field: stay.check_out
        room_count:
          minimum: 1
          type: integer
          x-canonical-field: allocation.room_count
        room_type:
          type: integer
          x-canonical-field: allocation.room_type
      required:
      - check_in
      - check_out
      - room_type
      - room_count
      type: object
    announcement: Teraz overim dostupnost.
    business_policy:
      availability_proof_ttl_seconds: null
      requires_availability_proof: false
      requires_caller_phone: false
      requires_final_confirmation: false
    connection: check-availability
    description: Check availability of selected bed type and date
    enabled: true
    request_mapping: "{\n  \"start_date\": business.stay.check_in,\n  \"end_date\"\
      : business.stay.check_out,\n  \"room_count\": business.allocation.room_count,\n\
      \  \"room_type\": business.allocation.room_type\n}"
    response:
      mapping: response.body
      mode: text
      output_schema:
        type: string
      success_output: null
    type: http.post_json
    validation_fixtures:
    - check_in: '2030-08-10'
      check_out: '2030-08-11'
      room_count: 1
      room_type: 2
    - check_in: '2030-09-09'
      check_out: '2030-09-10'
      room_count: 2
      room_type: 3
contact:
  address: null
  emails:
  - user.example@gmail.com
  - user.example@example.com
  phones:
  - '+421900000000'
  website: null
post_call_actions:
- id: send_transcript
  type: http.post_json
  connection: post_call-transcript
  request_mapping: "{\n  \"type\": \"post_call_transcription\",\n  \"data\": {\n \
    \   \"analysis\": {\n      \"transcript_summary\": inputs.summary.value\n    },\n\
    \    \"transcript\": inputs.transcript.value.{\n      \"role\": role = \"assistant\"\
    \ ? \"agent\" : role,\n      \"message\": content\n    },\n    \"conversation_initiation_client_data\"\
    : {\n      \"dynamic_variables\": {\n        \"system__time\": call.ended_at\n\
    \      }\n    },\n    \"user_id\": call.caller_number,\n    \"conversation_id\"\
    : call.conversation_id\n  }\n}"
  timeout_seconds: 10
  inputs:
    summary:
      artifact: call_summary
      representation: plain_text
    transcript:
      artifact: transcript
      representation: raw_json
