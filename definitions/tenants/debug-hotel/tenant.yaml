agent:
  display_name: Amelia
  greeting: Dobrý deň, tu je Amélia. Ako vám môžem pomôcť?
  profile: hotel_assistant
business:
  name: Debug Hotel
  type: hotel
conversation:
  scope: property_only
localization:
  default_locale: sk-SK
  timezone: Europe/Bratislava
schema_version: 4
capabilities: {}
contact:
  address: null
  emails:
  - user.example@gmail.com
  - user.example@example.com
  phones:
  - '+421900000000'
  website: null
post_call_actions:
  - id: send_transcript
    type: http.post_json
    connection: transcript_webhook
    inputs:
      summary:
        artifact: call_summary
        representation: plain_text
      transcript:
        artifact: transcript
        representation: raw_json
    request_mapping: |
      {
        "type": "post_call_transcription",
        "data": {
          "analysis": {
            "transcript_summary": inputs.summary.value
          },
          "transcript": inputs.transcript.value.{
            "role": role = "assistant" ? "agent" : role,
            "message": content
          },
          "conversation_initiation_client_data": {
            "dynamic_variables": {
              "system__time": call.ended_at
            }
          },
          "user_id": call.caller_number,
          "conversation_id": call.conversation_id
        }
      }
    timeout_seconds: 10
