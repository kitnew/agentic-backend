actions:
- action_id: send_transcript
  inputs:
    summary:
      artifact: call_summary
      representation: plain_text
    transcript:
      artifact: transcript
      representation: raw_json
  execution:
    type: http
    connection: post-call_transcript
    method: POST
    path: null
    query: null
    headers: {}
    request:
      codec: json
      mapping:
        data:
          user_id:
            $expr: call.caller_number
          analysis:
            transcript_summary:
              $expr: inputs.summary.value
          transcript:
            $expr: 'inputs.transcript.value.{"role": role = "assistant" ? "agent"
              : role, "message": content}'
          conversation_id:
            $expr: call.conversation_id
          conversation_initiation_client_data:
            dynamic_variables:
              system__time:
                $expr: call.ended_at
        type: post_call_transcription
      content_type: null
    response:
      codec: none
      mapping: null
    timeout_seconds: 10.0
    success_statuses: null
