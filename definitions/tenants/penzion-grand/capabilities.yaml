          original_start_date:
            $expr: business.stay.check_in
          booked_name:
            $expr: business.guest.name
          modification:
            $expr: business.custom.modification
          phone:
            $expr: 'business.guest.phone ? business.guest.phone : metadata.caller_phone'
          UserID:
            $expr: 'business.custom.UserID ? business.custom.UserID : metadata.caller_phone'
        content_type: null
      response:
