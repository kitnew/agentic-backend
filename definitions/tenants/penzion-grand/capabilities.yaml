capabilities:
  reservation.check_availability:
    enabled: true
    description: Check room availability
    announcement: I will check availability.
    agent_input_schema:
      type: object
      required:
      - check_in
      - check_out
      - room_type
      - room_count
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        room_type:
          type: integer
        room_count:
          type: integer
          minimum: 1
      additionalProperties: false
    bindings:
      check_in: stay.check_in
      check_out: stay.check_out
      room_type: allocation.room_type
      room_count: allocation.room_count
    input_constraints: []
    business_policy:
      requires_final_confirmation: false
      requires_availability_proof: false
      requires_caller_phone: false
      availability_proof_ttl_seconds: 10
    execution:
      type: http
      connection: check-availability
      method: POST
      path: null
      query: null
      headers:
        Accept: application/json
      request:
        codec: json
        mapping:
          end_date:
            $expr: business.stay.check_out
          room_type:
            $expr: business.allocation.room_type
          room_count:
            $expr: business.allocation.room_count
          start_date:
            $expr: business.stay.check_in
        content_type: null
      response:
        codec: text
        mapping: null
      timeout_seconds: 10.0
      success_statuses: null
    result_schema: null
