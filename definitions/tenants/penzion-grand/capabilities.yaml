capabilities:
  reservation.check_availability:
    enabled: true
    description: Check room availability
    announcement: Teraz overim dostupnosť.
    agent_input_schema:
      type: object
      required:
      - check_in
      - check_out
      - room_type
      - room_count
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        room_type:
          type: integer
          minimum: 1
        room_count:
          type: integer
          minimum: 1
      additionalProperties: false
    bindings:
      check_in: stay.check_in
      check_out: stay.check_out
      room_type: allocation.room_type
      room_count: allocation.room_count
    input_constraints:
    - kind: date_range
      start: stay.check_in
      end: stay.check_out
      start_not_in_past: true
    business_policy:
      requires_final_confirmation: false
      requires_availability_proof: false
      requires_caller_phone: false
      availability_proof_ttl_seconds: 10
    execution:
      type: http
      connection: check-availability
      method: POST
      path: null
      query: null
      headers:
        Accept: application/json
      request:
        codec: json
        mapping:
          end_date:
            $expr: business.stay.check_out
          room_type:
            $expr: business.allocation.room_type
          room_count:
            $expr: business.allocation.room_count
          start_date:
            $expr: business.stay.check_in
        content_type: null
      response:
        codec: text
        mapping: null
      timeout_seconds: 10.0
      success_statuses: null
    result_schema: null
  reservation.check_reservation:
    enabled: true
    description: Check reservation status
    announcement: Teraz overim to.
    agent_input_schema:
      type: object
      required:
      - check_in
      - check_out
      - guest_name
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guest_name:
          type: string
          pattern: '.*\S.*'
      additionalProperties: false
    bindings:
      check_in: stay.check_in
      check_out: stay.check_out
      guest_name: guest.name
    input_constraints:
    - kind: date_range
      start: stay.check_in
      end: stay.check_out
      start_not_in_past: true
    business_policy:
      requires_final_confirmation: false
      requires_availability_proof: false
      requires_caller_phone: false
      availability_proof_ttl_seconds: 10
    execution:
      type: http
      connection: check-reservation
      method: POST
      path: null
      query: null
      headers:
        Accept: application/json
      request:
        codec: json
        mapping:
          guest_name:
            $expr: business.guest.name
          check_in:
            $expr: business.stay.check_in
          check_out:
            $expr: business.stay.check_out
        content_type: null
      response:
        codec: text
        mapping: null
      timeout_seconds: 10.0
      success_statuses: null
    result_schema: null
  reservation.create_request:
    enabled: true
    description: Submit reservation creation request
    announcement: Teraz odoslem poziadavku na rezervaciu.
    agent_input_schema:
      type: object
      required:
      - start_date
      - end_date
      - guest_name
      - room_type
      - room_count
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        guest_name:
          type: string
          pattern: '.*\S.*'
        room_type:
          type: integer
          minimum: 1
        room_count:
          type: integer
          minimum: 1
        userID:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Optional alternate phone/user ID; omit to use the caller number.
        phone:
          type: string
          description: Optional contact phone; omit to use the caller number.
      additionalProperties: false
    bindings:
      start_date: stay.check_in
      end_date: stay.check_out
      guest_name: guest.name
      room_type: allocation.room_type
      room_count: allocation.room_count
      phone: guest.phone
    input_constraints:
    - kind: date_range
      start: stay.check_in
      end: stay.check_out
      start_not_in_past: true
    business_policy:
      requires_final_confirmation: true
      requires_availability_proof: false
      requires_caller_phone: true
      availability_proof_ttl_seconds: 10
    execution:
      type: http
      connection: reservation-request-create
      method: POST
      path: null
      query: null
      headers:
        Accept: application/json
      request:
        codec: json
        mapping:
          end_date:
            $expr: business.stay.check_out
          start_date:
            $expr: business.stay.check_in
          guest_name:
            $expr: business.guest.name
          room_type:
            $expr: business.allocation.room_type
          room_count:
            $expr: business.allocation.room_count
          userID:
            $expr: 'business.custom.userID ? business.custom.userID : metadata.caller_phone'
          phone:
            $expr: 'business.guest.phone ? business.guest.phone : metadata.caller_phone'
        content_type: null
      response:
        codec: none
        mapping: null
      timeout_seconds: 10.0
      success_statuses: null
    result_schema: null
  reservation.cancel_request:
    enabled: true
    description: Submit reservation cancellation request
    announcement: Teraz odoslem poziadavku na zrusenie rezervacie.
    agent_input_schema:
      type: object
      required:
      - original_start_date
      - original_end_date
      - booked_name
      - notes
      properties:
        original_start_date:
          type: string
          format: date
        original_end_date:
          type: string
          format: date
        booked_name:
          type: string
          pattern: '.*\S.*'
        notes:
          type: string
          minLength: 1
        UserID:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Optional alternate phone/user ID; omit to use the caller number.
      additionalProperties: false
    bindings:
      original_start_date: stay.check_in
      original_end_date: stay.check_out
      booked_name: guest.name
    input_constraints:
    - kind: date_range
      start: stay.check_in
      end: stay.check_out
      start_not_in_past: true
    business_policy:
      requires_final_confirmation: true
      requires_availability_proof: false
      requires_caller_phone: true
      availability_proof_ttl_seconds: 10
    execution:
      type: http
      connection: reservation-request-cancel
      method: POST
      path: null
      query: null
      headers:
        Accept: application/json
      request:
        codec: json
        mapping:
          original_end_date:
            $expr: business.stay.check_out
          original_start_date:
            $expr: business.stay.check_in
          booked_name:
            $expr: business.guest.name
          notes:
            $expr: business.custom.notes
          UserID:
            $expr: 'business.custom.UserID ? business.custom.UserID : metadata.caller_phone'
        content_type: null
      response:
        codec: none
        mapping: null
      timeout_seconds: 10.0
      success_statuses: null
    result_schema: null
  reservation.change_request:
    enabled: true
    description: Submit reservation change request
    announcement: Teraz odoslem poziadavku na zmenu rezervacie.
    agent_input_schema:
      type: object
