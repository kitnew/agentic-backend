          pattern: '.*\S.*'
        modification:
          type: string
          minLength: 1
        phone:
          type: string
          description: Optional contact phone; omit to use the caller number.
        UserID:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Optional alternate phone/user ID; omit to use the caller number.
      additionalProperties: false
    bindings:
      original_start_date: stay.check_in
