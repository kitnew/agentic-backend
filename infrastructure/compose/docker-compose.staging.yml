services:
  livekit-sip:
    image: livekit/sip:v1.2.0
    environment:
      SIP_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: "${LIVEKIT_SIP_WS_URL:?set LIVEKIT_SIP_WS_URL}"
        redis:
          address: "${LIVEKIT_SIP_REDIS_ADDRESS:-redis:6379}"
        sip_port: ${LIVEKIT_SIP_PORT:-5060}
        rtp_port: "${LIVEKIT_SIP_RTP_PORT:-10000-20000}"
        health_port: ${LIVEKIT_SIP_HEALTH_PORT:-8080}
        logging:
          level: info
    expose:
      - "${LIVEKIT_SIP_HEALTH_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
