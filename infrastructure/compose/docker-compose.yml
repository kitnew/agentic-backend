services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_EGRESS_ACCESS_KEY: ${MINIO_EGRESS_ACCESS_KEY:?set MINIO_EGRESS_ACCESS_KEY}
      MINIO_EGRESS_SECRET_KEY: ${MINIO_EGRESS_SECRET_KEY:?set MINIO_EGRESS_SECRET_KEY}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?set MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?set MINIO_WORKER_SECRET_KEY}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/call-recordings
        mc anonymous set none local/call-recordings
        mc admin user add local "$${MINIO_EGRESS_ACCESS_KEY}" "$${MINIO_EGRESS_SECRET_KEY}" || true
        mc admin policy attach local readwrite --user "$${MINIO_EGRESS_ACCESS_KEY}"
        mc admin user add local "$${MINIO_WORKER_ACCESS_KEY}" "$${MINIO_WORKER_SECRET_KEY}" || true
        mc admin policy attach local readonly --user "$${MINIO_WORKER_ACCESS_KEY}"
    depends_on:
      minio:
        condition: service_healthy

  livekit-egress:
    image: livekit/egress:v1.13.0
    security_opt:
      - seccomp=../livekit/egress/chrome-sandboxing-seccomp-profile.json
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: "${LIVEKIT_URL}"
        redis:
          address: "${LIVEKIT_EGRESS_REDIS_ADDRESS:-redis:6379}"
        health_port: ${LIVEKIT_EGRESS_HEALTH_PORT:-8080}
        enable_chrome_sandbox: true
        storage:
          s3:
            access_key: "${MINIO_EGRESS_ACCESS_KEY}"
            secret: "${MINIO_EGRESS_SECRET_KEY}"
            region: "${MINIO_REGION:-us-east-1}"
            endpoint: "${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}"
            bucket: "${MINIO_BUCKET:-call-recordings}"
            force_path_style: true
    expose:
      - "${LIVEKIT_EGRESS_HEALTH_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/backend
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:?set LIVEKIT_AGENT_NAME}
      LIVEKIT_PARTICIPANT_TOKEN_TTL_SECONDS: ${LIVEKIT_PARTICIPANT_TOKEN_TTL_SECONDS:-600}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CAPABILITY_JOB_STREAM: ${CAPABILITY_JOB_STREAM:-capability:jobs}
      CAPABILITY_JOB_CONSUMER_GROUP: ${CAPABILITY_JOB_CONSUMER_GROUP:-capability-workers}
      CAPABILITY_JOB_DEAD_LETTER_STREAM: ${CAPABILITY_JOB_DEAD_LETTER_STREAM:-capability:jobs:dead-letter}
      DOMAIN_EVENT_STREAM: ${DOMAIN_EVENT_STREAM:-domain:events}
      COMMAND_STREAM: ${COMMAND_STREAM:-application:commands}
      COMMAND_RESULT_STREAM: ${COMMAND_RESULT_STREAM:-application:command-results}
      OUTBOX_DISPATCH_ENABLED: "true"
      OUTBOX_DISPATCH_INTERVAL_SECONDS: ${OUTBOX_DISPATCH_INTERVAL_SECONDS:-1}
      CALL_RUNTIME_RECONCILIATION_ENABLED: ${CALL_RUNTIME_RECONCILIATION_ENABLED:-true}
      CALL_RUNTIME_RECONCILIATION_INTERVAL_SECONDS: ${CALL_RUNTIME_RECONCILIATION_INTERVAL_SECONDS:-60}
      CALL_RUNTIME_RECONCILIATION_GRACE_SECONDS: ${CALL_RUNTIME_RECONCILIATION_GRACE_SECONDS:-120}
      CALL_RUNTIME_RECONCILIATION_BATCH_SIZE: ${CALL_RUNTIME_RECONCILIATION_BATCH_SIZE:-100}
      CALL_RECORDING_ENABLED: ${CALL_RECORDING_ENABLED:-false}
      CAPABILITY_INVOCATION_PII_RETENTION_SECONDS: ${CAPABILITY_INVOCATION_PII_RETENTION_SECONDS:-2592000}
      CAPABILITY_OUTBOX_RETENTION_SECONDS: ${CAPABILITY_OUTBOX_RETENTION_SECONDS:-604800}
      CAPABILITY_STREAM_MAXLEN: ${CAPABILITY_STREAM_MAXLEN:-10000}
      CAPABILITY_RETENTION_MAINTENANCE_INTERVAL_SECONDS: ${CAPABILITY_RETENTION_MAINTENANCE_INTERVAL_SECONDS:-3600}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  voice-agent:
    build:
      context: ../..
      dockerfile: apps/voice-agent/Dockerfile
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:?set LIVEKIT_AGENT_NAME}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL:-http://backend:8000}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      BACKEND_HTTP_TIMEOUT_SECONDS: ${BACKEND_HTTP_TIMEOUT_SECONDS:-10}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:?set AZURE_OPENAI_MODEL}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?set AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:?set AZURE_OPENAI_API_VERSION}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_RETRY_LIMIT: ${PROVIDER_RETRY_LIMIT:-3}
      PARTICIPANT_WAIT_TIMEOUT_SECONDS: ${PARTICIPANT_WAIT_TIMEOUT_SECONDS:-300}
      CAPABILITY_POLL_TIMEOUT_SECONDS: ${CAPABILITY_POLL_TIMEOUT_SECONDS:-15}
      CAPABILITY_POLL_INTERVAL_SECONDS: ${CAPABILITY_POLL_INTERVAL_SECONDS:-0.5}
    depends_on:
      backend:
        condition: service_healthy

  job-worker:
    build:
      context: ../..
      dockerfile: apps/job-worker/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CAPABILITY_JOB_STREAM: ${CAPABILITY_JOB_STREAM:-capability:jobs}
      CAPABILITY_JOB_CONSUMER_GROUP: ${CAPABILITY_JOB_CONSUMER_GROUP:-capability-workers}
      CAPABILITY_JOB_DEAD_LETTER_STREAM: ${CAPABILITY_JOB_DEAD_LETTER_STREAM:-capability:jobs:dead-letter}
      CAPABILITY_JOB_MAX_RETRIES: ${CAPABILITY_JOB_MAX_RETRIES:-3}
      CAPABILITY_JOB_STALE_IDLE_MS: ${CAPABILITY_JOB_STALE_IDLE_MS:-30000}
      COMMAND_STREAM: ${COMMAND_STREAM:-application:commands}
      COMMAND_CONSUMER_GROUP: ${COMMAND_CONSUMER_GROUP:-job-workers}
      COMMAND_RESULT_STREAM: ${COMMAND_RESULT_STREAM:-application:command-results}
      COMMAND_DEAD_LETTER_STREAM: ${COMMAND_DEAD_LETTER_STREAM:-application:commands:dead-letter}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL:-http://backend:8000}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      GOOGLE_SHEETS_CREDENTIAL_FILE_MAP: ${GOOGLE_SHEETS_CREDENTIAL_FILE_MAP:-{}}
      GOOGLE_SHEETS_CREDENTIAL_SECRETS_DIR: ${GOOGLE_SHEETS_CREDENTIAL_SECRETS_DIR:-/run/secrets}
      MANAGED_WEBHOOK_CONNECTION_MAP: ${MANAGED_WEBHOOK_CONNECTION_MAP:-{}}
      MANAGED_WEBHOOK_CONNECTION_MAP_FILE: ${MANAGED_WEBHOOK_CONNECTION_MAP_FILE:-/secrets/managed-webhooks.json}
      ALLOW_INSECURE_MANAGED_WEBHOOKS: ${ALLOW_INSECURE_MANAGED_WEBHOOKS:-false}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?set AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:?set AZURE_OPENAI_API_VERSION}
      MINIO_ENDPOINT: ${MINIO_WORKER_ENDPOINT:-minio:9000}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:?set MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?set MINIO_WORKER_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-call-recordings}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - ${GOOGLE_SHEETS_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ${GOOGLE_SHEETS_CREDENTIALS_DIR:-./secrets}:/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
