services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [application]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [application]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [application]

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/backend
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?set INTEGRATION_ENCRYPTION_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:?set LIVEKIT_AGENT_NAME}
      LIVEKIT_PARTICIPANT_TOKEN_TTL_SECONDS: ${LIVEKIT_PARTICIPANT_TOKEN_TTL_SECONDS:-600}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CAPABILITY_JOB_STREAM: ${CAPABILITY_JOB_STREAM:-capability:jobs}
      CAPABILITY_JOB_CONSUMER_GROUP: ${CAPABILITY_JOB_CONSUMER_GROUP:-capability-workers}
      CAPABILITY_JOB_DEAD_LETTER_STREAM: ${CAPABILITY_JOB_DEAD_LETTER_STREAM:-capability:jobs:dead-letter}
      DOMAIN_EVENT_STREAM: ${DOMAIN_EVENT_STREAM:-domain:events}
      COMMAND_STREAM: ${COMMAND_STREAM:-application:commands}
      COMMAND_RESULT_STREAM: ${COMMAND_RESULT_STREAM:-application:command-results}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-backend-core}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext}
      OUTBOX_DISPATCH_ENABLED: "true"
      OUTBOX_DISPATCH_INTERVAL_SECONDS: ${OUTBOX_DISPATCH_INTERVAL_SECONDS:-1}
      CALL_RUNTIME_RECONCILIATION_ENABLED: ${CALL_RUNTIME_RECONCILIATION_ENABLED:-true}
      CALL_RUNTIME_RECONCILIATION_INTERVAL_SECONDS: ${CALL_RUNTIME_RECONCILIATION_INTERVAL_SECONDS:-60}
      CALL_RUNTIME_RECONCILIATION_GRACE_SECONDS: ${CALL_RUNTIME_RECONCILIATION_GRACE_SECONDS:-120}
      CALL_RUNTIME_RECONCILIATION_BATCH_SIZE: ${CALL_RUNTIME_RECONCILIATION_BATCH_SIZE:-100}
      CALL_RECORDING_ENABLED: ${CALL_RECORDING_ENABLED:-false}
      CAPABILITY_INVOCATION_PII_RETENTION_SECONDS: ${CAPABILITY_INVOCATION_PII_RETENTION_SECONDS:-2592000}
      CAPABILITY_OUTBOX_RETENTION_SECONDS: ${CAPABILITY_OUTBOX_RETENTION_SECONDS:-604800}
      CAPABILITY_STREAM_MAXLEN: ${CAPABILITY_STREAM_MAXLEN:-10000}
      CAPABILITY_RETENTION_MAINTENANCE_INTERVAL_SECONDS: ${CAPABILITY_RETENTION_MAINTENANCE_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [application]

  control-plane-service:
    build:
      context: ../..
      dockerfile: apps/control-plane-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/backend
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: control-plane-service
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [application]

  voice-agent:
    build:
      context: ../..
      dockerfile: apps/voice-agent/Dockerfile
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:?set LIVEKIT_AGENT_NAME}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL:-http://backend:8000}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      BACKEND_HTTP_TIMEOUT_SECONDS: ${BACKEND_HTTP_TIMEOUT_SECONDS:-10}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: voice-agent
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?set AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:?set AZURE_OPENAI_API_VERSION}
      VOICE_ARCHITECTURE: ${VOICE_ARCHITECTURE:-cascade}
      AZURE_REALTIME_ENDPOINT: ${AZURE_REALTIME_ENDPOINT:-}
      AZURE_REALTIME_API_KEY: ${AZURE_REALTIME_API_KEY:-}
      AZURE_REALTIME_DEPLOYMENT: ${AZURE_REALTIME_DEPLOYMENT:-}
      AZURE_REALTIME_VOICE: ${AZURE_REALTIME_VOICE:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_RETRY_LIMIT: ${PROVIDER_RETRY_LIMIT:-3}
      PARTICIPANT_WAIT_TIMEOUT_SECONDS: ${PARTICIPANT_WAIT_TIMEOUT_SECONDS:-300}
      CAPABILITY_POLL_TIMEOUT_SECONDS: ${CAPABILITY_POLL_TIMEOUT_SECONDS:-15}
      CAPABILITY_POLL_INTERVAL_SECONDS: ${CAPABILITY_POLL_INTERVAL_SECONDS:-0.15}
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]

  job-worker:
    build:
      context: ../..
      dockerfile: apps/job-worker/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CAPABILITY_JOB_STREAM: ${CAPABILITY_JOB_STREAM:-capability:jobs}
      CAPABILITY_JOB_CONSUMER_GROUP: ${CAPABILITY_JOB_CONSUMER_GROUP:-capability-workers}
      CAPABILITY_JOB_DEAD_LETTER_STREAM: ${CAPABILITY_JOB_DEAD_LETTER_STREAM:-capability:jobs:dead-letter}
      CAPABILITY_JOB_MAX_RETRIES: ${CAPABILITY_JOB_MAX_RETRIES:-3}
      CAPABILITY_JOB_STALE_IDLE_MS: ${CAPABILITY_JOB_STALE_IDLE_MS:-30000}
      COMMAND_STREAM: ${COMMAND_STREAM:-application:commands}
      COMMAND_CONSUMER_GROUP: ${COMMAND_CONSUMER_GROUP:-job-workers}
      COMMAND_RESULT_STREAM: ${COMMAND_RESULT_STREAM:-application:command-results}
      COMMAND_DEAD_LETTER_STREAM: ${COMMAND_DEAD_LETTER_STREAM:-application:commands:dead-letter}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL:-http://backend:8000}
      INTERNAL_API_AUDIENCE: ${INTERNAL_API_AUDIENCE:-backend-core}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: job-worker
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext}
      ALLOW_INSECURE_MANAGED_WEBHOOKS: ${ALLOW_INSECURE_MANAGED_WEBHOOKS:-false}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?set AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:?set AZURE_OPENAI_API_VERSION}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:?set MINIO_WORKER_SECRET_KEY}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [application]

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_GRAFANA_URL: ${ADMIN_WEB_GRAFANA_URL:-http://127.0.0.1:3001}
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]

networks:
  application:

volumes:
  postgres-data:
  redis-data:
  nats-data:
