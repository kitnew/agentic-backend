services:
  livekit:
    image: livekit/livekit-server:v1.13.1
    command:
      [
        "--dev",
        "--bind",
        "0.0.0.0",
        "--node-ip",
        "${LIVEKIT_NODE_IP:-127.0.0.1}",
        "--udp-port",
        "${LIVEKIT_UDP_PORT:-7882}",
        "--keys",
        "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}",
      ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/webhooks/livekit
    depends_on:
      redis:
        condition: service_healthy

  backend:
    environment:
      CALL_RECORDING_ENABLED: ${CALL_RECORDING_ENABLED:-true}

  voice-agent:
    depends_on:
      livekit:
        condition: service_started

  debug-chat:
    build:
      context: ../..
      dockerfile: apps/debug-chat/Dockerfile
    ports:
      - "${DEBUG_CHAT_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
