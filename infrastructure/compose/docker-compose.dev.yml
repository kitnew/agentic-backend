name: agentic-backend-dev

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
    networks: [application]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}",
      ]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [application]

  tempo:
    image: grafana/tempo:3.0.0
    command:
      [
        "-config.file=/etc/tempo/tempo.yml",
        "-backend-scheduler.provider.work.compaction.block-retention=${TEMPO_RETENTION:-168h}",
      ]
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [application]

  grafana:
    image: grafana/grafana:12.4.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/backend
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      BACKEND_CORE_SERVICE_SECRET: ${BACKEND_CORE_SERVICE_SECRET:?set BACKEND_CORE_SERVICE_SECRET}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      CALL_RECORDING_ENABLED: "false"

  voice-agent:
    environment:
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
    depends_on:
      livekit:
        condition: service_started

  job-worker:
    environment:
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
  livekit:
    image: livekit/livekit-server:v1.13.1
    command:
      [
        "--dev",
        "--bind",
        "0.0.0.0",
        "--node-ip",
        "${LIVEKIT_NODE_IP:-127.0.0.1}",
        "--udp-port",
        "${LIVEKIT_UDP_PORT:-7882}",
        "--keys",
        "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}",
      ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/webhooks/livekit
    depends_on:
      redis:
        condition: service_healthy
    networks: [application]

  admin-web:
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-3000}:8080"

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
