name: agentic-backend-dev

services:
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/backend
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      CALL_RECORDING_ENABLED: "false"

  voice-agent:
    environment:
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      VOICE_AGENT_SERVICE_SECRET: ${VOICE_AGENT_SERVICE_SECRET:?set VOICE_AGENT_SERVICE_SECRET}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
    depends_on:
      livekit:
        condition: service_started

  job-worker:
    environment:
      JOB_WORKER_SERVICE_SECRET: ${JOB_WORKER_SERVICE_SECRET:?set JOB_WORKER_SERVICE_SECRET}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}

  livekit:
    image: livekit/livekit-server:v1.13.1
    command:
      [
        "--dev",
        "--bind",
        "0.0.0.0",
        "--node-ip",
        "${LIVEKIT_NODE_IP:-127.0.0.1}",
        "--udp-port",
        "${LIVEKIT_UDP_PORT:-7882}",
        "--keys",
        "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}",
      ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/webhooks/livekit
    depends_on:
      redis:
        condition: service_healthy
    networks: [application]

  debug-chat:
    ports:
      - "${DEBUG_CHAT_PORT:-3000}:8080"
