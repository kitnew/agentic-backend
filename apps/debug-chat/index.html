<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Agent Debug</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
      fieldset { margin: 1rem 0; display: grid; gap: .65rem; }
      label { display: grid; gap: .25rem; }
      input, textarea, button { font: inherit; padding: .5rem; }
      textarea { min-height: 5rem; }
      select, meter { width: 100%; }
      button { cursor: pointer; }
      [role="tablist"], .row { display: flex; gap: .5rem; flex-wrap: wrap; }
      [role="tabpanel"] { margin-top: 1rem; }
      #status { white-space: pre-wrap; padding: .75rem; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/dist/livekit-client.umd.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <h1>Voice Agent Debug</h1>
    <p>Local development helper. Tokens remain only in page memory.</p>

    <fieldset>
      <legend>Backend access</legend>
      <label>Admin token <input id="admin-token" type="password" autocomplete="off" required></label>
    </fieldset>

    <div role="tablist" aria-label="Voice setup">
      <button role="tab" aria-selected="true" aria-controls="tenant-panel" id="tenant-tab">1. Tenant</button>
      <button role="tab" aria-selected="false" aria-controls="prompt-panel" id="prompt-tab">2. Prompt</button>
      <button role="tab" aria-selected="false" aria-controls="config-panel" id="config-tab">3. Config</button>
      <button role="tab" aria-selected="false" aria-controls="call-panel" id="call-tab">4. Call</button>
    </div>

    <section role="tabpanel" id="tenant-panel" aria-labelledby="tenant-tab">
      <fieldset>
        <legend>Create tenant</legend>
        <label>Slug <input id="tenant-slug" value="debug-hotel" required></label>
        <label>Display name <input id="tenant-name" value="Debug Hotel" required></label>
        <label>Business type <input id="business-type" value="hotel" required></label>
        <div class="row"><button id="create-tenant" type="button">Create tenant</button><output id="tenant-result"></output></div>
      </fieldset>
    </section>

    <section role="tabpanel" id="prompt-panel" aria-labelledby="prompt-tab" hidden>
      <fieldset>
        <legend>Create and publish prompt bundle</legend>
        <label>Tenant ID <input id="prompt-tenant-id" required></label>
        <label>System instructions <textarea id="system-instructions">You are a helpful hotel voice assistant. Speak Slovak.</textarea></label>
        <label>Tenant instructions <textarea id="tenant-instructions">Answer briefly and only about this hotel.</textarea></label>
        <label>Knowledge <textarea id="knowledge">Breakfast is served from 07:00 to 10:00.</textarea></label>
        <div class="row"><button id="create-prompt" type="button">Create and publish prompt</button><output id="prompt-result"></output></div>
      </fieldset>
    </section>

    <section role="tabpanel" id="config-panel" aria-labelledby="config-tab" hidden>
      <fieldset>
        <legend>Create and publish configuration</legend>
        <label>Tenant ID <input id="config-tenant-id" required></label>
        <label>Published prompt revision ID <input id="prompt-revision-id" required></label>
        <label>Locale <input id="locale" value="sk-SK" required></label>
        <label>Timezone <input id="timezone" value="Europe/Bratislava" required></label>
        <label>Agent name <input id="agent-name" value="Amelia" required></label>
        <label>Greeting <input id="greeting" value="Dobrý deň, tu je Amélia. Ako vám môžem pomôcť?" required></label>
        <div class="row"><button id="create-config" type="button">Create and publish config</button><output id="config-result"></output></div>
      </fieldset>
    </section>

    <section role="tabpanel" id="call-panel" aria-labelledby="call-tab" hidden>
      <fieldset>
        <legend>Start test call</legend>
        <label>Voice-ready tenant ID <input id="call-tenant-id" required></label>
        <label>Microphone <select id="mic-device"><option value="">Default microphone</option></select></label>
        <div class="row">
          <button id="create-call" type="button">Create test call</button>
          <button id="check-mic" type="button">Check microphone</button>
          <button id="connect" type="button" disabled>Connect microphone</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
        </div>
        <label>Input level <meter id="mic-meter" min="0" max="1" value="0"></meter></label>
        <output id="mic-state">Microphone not checked.</output>
        <output id="call-result"></output>
      </fieldset>
    </section>

    <h2>Status</h2>
    <pre id="status" aria-live="polite">Ready.</pre>
  </body>
</html>
