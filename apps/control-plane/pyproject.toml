[project]
name = "control-plane"
version = "0.1.0"
description = "Agent Platform Admin Control Plane CLI"
requires-python = ">=3.14.6"
dependencies = [
    "admin-client",
    "httpx>=0.28.1,<0.29.0",
]

[tool.uv.sources]
admin-client = { workspace = true }

[project.scripts]
agentctl = "control_plane.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
