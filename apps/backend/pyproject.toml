[project]
name = "backend-core"
version = "0.1.0"
description = "Backend Core API and business logic"
authors = [
    { name = "Nikita Chernysh", email = "h3s0y4mchik@gmail.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "contracts",
    "agentic-observability",
    "fastapi>=0.140.13",
    "livekit-api>=1.2.0",
    "jsonata-python==0.7.0",
    "jsonschema>=4.25.1",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-instrumentation-aiohttp-client>=0.60b1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-redis>=0.60b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
contracts = { workspace = true }
agentic-observability = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
