[project]
name = "agentic-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp==3.14.1",
    "fastapi==0.115.14",
    "google-api-python-client==2.197.0",
    "livekit-agents[elevenlabs,openai,silero]==1.6.5",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==8.0.1",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.47.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
